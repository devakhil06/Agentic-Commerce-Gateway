[project]
name = "agentic-commerce-gateway"
version = "0.1.0"
description = "Explainable, policy-gated agentic commerce gateway for AI buyers and Razorpay."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "cryptography>=44,<47",
  "langgraph>=0.3,<2",
  "redis>=5,<7",
  "celery>=5.4,<6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "backend.app.main:app"
